<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Jagd Thuine – Test</title>
<style>
:root { --bg: #e9ead6; --paper: #f6f5e8; --ink: #23281d; --muted: #66694f; --green: #1f4a24; --line: #d3d4bb; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; padding: 24px 16px; }
main { width: 100%; max-width: 440px; text-align: center; }
img { width: 120px; height: auto; }
h1 { font: 600 26px/1.2 Georgia, serif; color: var(--green); margin: 10px 0 4px; }
.tag { display: inline-block; background: #b3261e; color: #fff; font-weight: 700; font-size: 12px; letter-spacing: .08em; padding: 3px 10px; border-radius: 99px; }
p { color: var(--muted); }
a.app { display: block; margin: 12px 0; padding: 16px; border-radius: 14px; background: var(--paper); border: 1px solid var(--line); color: var(--green); font-weight: 700; font-size: 18px; text-decoration: none; }
a.app small { display: block; font-weight: 400; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <img src="thuine/icons/logo.png" alt="Jagdgemeinschaft Thuine">
  <h1>Jagd Thuine</h1>
  <span class="tag">TESTUMGEBUNG</span>
  <p>Hier werden neue Funktionen (Konten, Benachrichtigungen) ausprobiert. Änderungen landen nur in diesem Test-Repo – die echten Apps bleiben unberührt.</p>
  <a class="app" href="thuine/">Jagd Thuine (Test)<small>Strecke, Schalenwild, Termine</small></a>
  <a class="app" href="hochsitze/">Hochsitze (Test)<small>Karte, Hochsitze, Salzlecken</small></a>
</main>
</body>
</html>
